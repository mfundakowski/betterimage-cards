name: publish

# Publishes the version in package.json when a GitHub release is created.
# `--provenance` attaches a signed attestation tying the tarball to this
# repository and commit, which npm shows on the package page.
#
# Auth is npm trusted publishing: the package names this repository and
# this workflow file as its publisher, and the OIDC token below proves the
# run really is that workflow, so no npm token has to exist anywhere. The
# runner image ships an npm too old to exchange that token, hence the
# upgrade step.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
